name: emuongozo
description: e-Muongozo mobile — offline-first study guides for Tanzanian students
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local storage
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0

  # HTTP
  dio: ^5.4.3+1
  pdfx: ^2.6.0
  nearby_service: ^0.2.1

  # PDF viewing
  syncfusion_flutter_pdfviewer: ^28.1.33

  # SVG rendering
  flutter_svg: ^2.0.10+1

  # P2P sharing (Phase 2)
  # flutter_nearby_connections: ^1.1.2  # removed: no Flutter 3.x compatible version
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1

  # Utilities
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  url_launcher: ^6.2.6
  sqflite_common_ffi_web: ^1.2.0
  sqlite3_flutter_libs: ^0.6.0+eol

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/logos/


flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/logos/tie.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1E2050"
  adaptive_icon_foreground: "assets/logos/tie.png"
  web:
    generate: true
    image_path: "assets/logos/tie.png"
    background_color: "#1E2050"
    theme_color: "#1E2050"
  windows:
    generate: true
    image_path: "assets/logos/tie.png"
    icon_size: 48
